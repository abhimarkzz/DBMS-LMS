spring:
  application:
    name: course-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms_db}
    username: ${SPRING_DATASOURCE_USERNAME:lms_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_in_production}
    hikari:
      # HikariCP connection pool settings
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000      # 30 seconds
      idle-timeout: 600000           # 10 minutes
      max-lifetime: 1800000          # 30 minutes
      connection-test-query: SELECT 1

  jpa:
    # NEVER use create or create-drop in production — schema is managed by SQL migrations
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Use batch inserts for better performance when inserting multiple rows
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Redis configuration for course caching
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes default TTL

# JWT configuration — must match User Service secret
jwt:
  secret: ${JWT_SECRET}
  algorithm: HS256

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging
logging:
  level:
    com.lms: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: ${SHOW_SQL:false}

server:
  port: 8080
  error:
    include-message: never     # Don't leak exception messages in production
    include-stacktrace: never

---
# Test profile — uses H2 in-memory instead of PostgreSQL
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

jwt:
  secret: test-secret-key-that-is-at-least-32-characters-long-for-hs256
