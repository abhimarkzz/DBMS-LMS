server:
  port: 8003

spring:
  application:
    name: result-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lms}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Validations rely on schema created manually
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:thisisaverylongsecretkeyforjwttestingonly32chars}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api/v1/results/docs
  swagger-ui:
    path: /api/v1/results/swagger-ui.html
